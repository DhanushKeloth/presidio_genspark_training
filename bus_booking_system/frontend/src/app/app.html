<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">

      <!-- Logo -->
      <div class="flex items-center gap-2">
        <span class="text-2xl">🚌</span>
        <div>
          <p class="text-3xl font-bold leading-none text-blue-700">BusBooker</p>
          <p class="text-xs text-slate-500">Travel Easy. Book Happy.</p>
        </div>
      </div>

      <!-- Nav links -->
      <nav class="hidden items-center gap-8 text-sm font-medium text-slate-700 md:flex">
        <a routerLink="/user/search" routerLinkActive="border-blue-600 text-blue-700" class="border-b-2 border-transparent pb-1">Home</a>
        <a routerLink="/user/buses" routerLinkActive="border-blue-600 text-blue-700" class="border-b-2 border-transparent pb-1">Search Buses</a>
        <a routerLink="/user/bookings" routerLinkActive="border-blue-600 text-blue-700" class="border-b-2 border-transparent pb-1">My Bookings</a>
        <a class="border-b-2 border-transparent pb-1 cursor-pointer">Offers</a>
        <a class="border-b-2 border-transparent pb-1 cursor-pointer">Help</a>
      </nav>

      <!-- Right side: guest buttons OR profile avatar -->
      <div class="flex items-center gap-3">

        <!-- GUEST: Login / Register -->
        <ng-container *ngIf="!(currentUser$ | async)">
          <button
            id="btn-nav-login"
            routerLink="/auth"
            class="rounded-lg border border-slate-300 px-5 py-2 text-sm font-medium text-slate-800 transition hover:bg-slate-50">
            Login
          </button>
          <button
            id="btn-nav-register"
            routerLink="/auth"
            class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-blue-700">
            Register
          </button>
        </ng-container>

        <!-- LOGGED IN: Profile avatar + dropdown -->
        <ng-container *ngIf="currentUser$ | async as user">
          <div class="relative">
            <!-- Avatar button -->
            <button
              id="btn-profile-avatar"
              (click)="toggleDropdown($event)"
              class="flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50">
              <!-- Initial circle -->
              <span class="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-sm font-bold text-white">
                {{ getInitial(user.name) }}
              </span>
              <!-- Name (truncated) -->
              <span class="hidden max-w-[120px] truncate md:block">{{ user.name }}</span>
              <!-- Chevron -->
              <svg
                class="h-4 w-4 text-slate-400 transition-transform"
                [class.rotate-180]="dropdownOpen"
                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Dropdown panel -->
            <div
              id="profile-dropdown"
              *ngIf="dropdownOpen"
              class="absolute right-0 z-50 mt-2 w-56 rounded-xl border border-slate-200 bg-white shadow-lg">

              <!-- User info header -->
              <div class="border-b border-slate-100 px-4 py-3">
                <p class="truncate text-sm font-semibold text-slate-800">{{ user.name }}</p>
                <p class="truncate text-xs text-slate-500">{{ user.email }}</p>
                <span class="mt-1 inline-block rounded-full bg-blue-50 px-2 py-0.5 text-xs font-medium text-blue-700">
                  {{ user.role }}
                </span>
              </div>

              <!-- Menu items -->
              <ul class="py-1 text-sm text-slate-700">
                <li>
                  <a
                    id="dropdown-my-bookings"
                    routerLink="/user/bookings"
                    (click)="dropdownOpen = false"
                    class="flex items-center gap-2 px-4 py-2 transition hover:bg-slate-50 cursor-pointer">
                    <span>🎫</span> My Bookings
                  </a>
                </li>
                <li>
                  <a
                    id="dropdown-profile"
                    routerLink="/user/profile"
                    (click)="dropdownOpen = false"
                    class="flex items-center gap-2 px-4 py-2 transition hover:bg-slate-50 cursor-pointer">
                    <span>👤</span> Profile
                  </a>
                </li>
                <li class="border-t border-slate-100 mt-1">
                  <button
                    id="btn-logout"
                    (click)="logout()"
                    class="flex w-full items-center gap-2 px-4 py-2 text-left text-red-600 transition hover:bg-red-50">
                    <span>🚪</span> Logout
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </ng-container>

      </div>
    </div>
  </header>

  <router-outlet />
</div>
